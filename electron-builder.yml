appId: ai.cherryxiao.lyramd
productName: LyraMD
copyright: Copyright © 2026 Cherry Xiao. Based on ColaMD © 2026 marswave.ai

directories:
  output: release
  buildResources: resources

files:
  - dist/**/*
  # 运行时 JS 已全部由 electron-vite 打进 dist（dist 内只有 Node 内置与 electron 的 require），
  # 不要把整棵生产依赖树（mermaid/katex/docx 等）拷进 app.asar——纯死重，拖慢安装与启动 IO。
  # 参考：ColaMD 同样处理将 asar 从 169MB 降到 10.7MB（docs/packaging.md）。
  - '!node_modules/**/*'

asar:
  smartUnpack: false

# 只保留 en/zh 语言包：全套 Electron locale 多占数十 MB
electronLanguages:
  - en-US
  - en_US
  - zh-CN
  - zh_CN

extraResources:
  - from: mcp
    to: mcp
    filter:
      - "**/*"
  - from: resources/templates
    to: templates
    filter:
      - "**/*"
  - from: resources/demo
    to: demo
    filter:
      - "**/*"

npmArgs:
  - "--loglevel=error"

afterPack: ./scripts/afterPack.js

publish:
  provider: github
  owner: Afeng01
  repo: LyraMD

fileAssociations:
  - ext: md
    name: Markdown Document
    role: Editor
    mimeType: text/markdown
  - ext: markdown
    name: Markdown Document
    role: Editor
    mimeType: text/markdown
  - ext: mdown
    name: Markdown Document
    role: Editor
    mimeType: text/markdown
  - ext: mkd
    name: Markdown Document
    role: Editor
    mimeType: text/markdown

mac:
  target:
    - dmg
    - zip
  category: public.app-category.productivity
  icon: resources/icon.icns

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: resources/icon.ico

linux:
  target:
    - AppImage
    - deb
  category: Office
  icon: resources/icon.png

nsis:
  artifactName: ${productName}-Setup-${version}-${arch}.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
  shortcutName: LyraMD
  uninstallDisplayName: LyraMD
  installerIcon: resources/icon.ico
  uninstallerIcon: resources/icon.ico
