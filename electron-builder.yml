appId: ai.cherryxiao.lyramd
productName: LyraMD
copyright: Copyright © 2026 Cherry Xiao. Based on ColaMD © 2026 marswave.ai

directories:
  output: release
  buildResources: resources

files:
  - dist/**/*

extraResources:
  - from: mcp
    to: mcp
    filter:
      - "**/*"

npmArgs:
  - "--loglevel=error"

afterPack: ./scripts/afterPack.js

publish:
  provider: github
  owner: Afeng01
  repo: LyraMD

fileAssociations:
  - ext: md
    name: Markdown Document
    role: Editor
    mimeType: text/markdown
  - ext: markdown
    name: Markdown Document
    role: Editor
    mimeType: text/markdown
  - ext: mdown
    name: Markdown Document
    role: Editor
    mimeType: text/markdown
  - ext: mkd
    name: Markdown Document
    role: Editor
    mimeType: text/markdown

mac:
  target:
    - dmg
    - zip
  category: public.app-category.productivity
  icon: resources/icon.icns

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: resources/icon.ico

linux:
  target:
    - AppImage
    - deb
  category: Office
  icon: resources/icon.png

nsis:
  artifactName: ${productName}-Setup-${version}-${arch}.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
  shortcutName: LyraMD
  uninstallDisplayName: LyraMD
  installerIcon: resources/icon.ico
  uninstallerIcon: resources/icon.ico
